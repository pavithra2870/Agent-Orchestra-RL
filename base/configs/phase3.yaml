# Phase 3 configuration: PPO, trajectory logging, and offline CQL.
# env block mirrors phase1/phase2 so the reward formula stays identical.

env:
  success_reward: 10.0
  lam: 0.1
  mu: 0.1
  failure_penalty: 2.0
  seed: 42

ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  update_epochs: 4
  minibatch_size: 64
  embed_dim: 8
  hidden_dim: 64
  n_steps_per_update: 512   # env steps collected per rollout before each PPO update
  total_train_steps: 100000
  eval_episodes: 300
  seed: 42

# The "partially-trained policy" used (alongside the rule-based agent) to
# generate the logged offline dataset. Deliberately under-trained (far fewer
# episodes than Phase 2's DQN) so it is a genuinely mediocre behavior policy,
# not a proxy for a fully-trained one.
partial_dqn:
  lr: 0.001
  gamma: 0.95
  epsilon_start: 1.0
  epsilon_end: 0.3
  epsilon_decay_episodes: 500
  target_update_freq: 300
  embed_dim: 8
  hidden_dim: 64
  buffer_capacity: 20000
  batch_size: 64
  warmup_steps: 300
  train_episodes: 600
  seed: 7

trajectory_logging:
  n_episodes: 4000
  rule_based_weight: 0.5
  partial_dqn_weight: 0.5
  seed: 123

cql:
  lr: 0.001
  gamma: 0.95
  alpha: 1.0              # conservative regularizer weight
  target_update_freq: 500
  embed_dim: 8
  hidden_dim: 64
  batch_size: 64
  train_steps: 20000      # gradient steps over the fixed logged dataset
  eval_episodes: 300
  seed: 42
